[project]
name = "portafolio-backend"
version = "0.1.0"
description = "API para la plataforma de portafolio de software"
requires-python = ">=3.14.6,<3.15"
dependencies = [
    "fastapi>=0.135.0",
    "pydantic-settings>=2.13.0",
    "python-multipart>=0.0.22",
    "uvicorn[standard]>=0.41.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
